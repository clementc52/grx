name: collect

on:
  schedule:
    - cron: "17 * * * *"     # hourly: home-area flyers + online prices
    - cron: "47 */6 * * *"   # every 6 h: full radius sweep
    - cron: "33 11 * * *"    # daily: shelf-price history + StatCan
    - cron: "7 4-7 * * 4"    # Thursday 11 pm-2 am Toronto: new weekly flyers go live, sweep the radius every hour
  workflow_dispatch:
    inputs:
      job:
        description: "light | full | daily | all | test-push"
        default: "all"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore working state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hammer
            data/flipp/latest.json
          key: grx-state-${{ github.run_id }}
          restore-keys: grx-state-
      - name: Decide what to run
        id: d
        run: |
          S="${{ github.event.schedule }}"; J="${{ github.event.inputs.job }}"
          full=false; daily=false
          [ "$S" = "47 */6 * * *" ] && full=true
          [ "$S" = "7 4-7 * * 4" ] && full=true
          [ "$S" = "33 11 * * *" ] && daily=true
          [ "$J" = "full" ] && full=true
          [ "$J" = "daily" ] && daily=true
          if [ "$J" = "all" ]; then full=true; daily=true; fi
          [ -f data/hammer/series.json ] || daily=true
          [ -f data/flipp/latest.json ] || full=true
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "daily=$daily" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: python tests/test_all.py
      - name: Shelf-price history (Project Hammer; reloads within the hour of each new daily load)
        run: python -m grx.run hammer ${{ steps.d.outputs.daily == 'true' && '' || '--if-new' }} || echo "::warning::Project Hammer load failed; keeping cached history"
      - name: StatCan averages
        if: steps.d.outputs.daily == 'true'
        run: python -m grx.run statcan || echo "::warning::StatCan load failed"
      - name: In-store prices (Open Prices, open data)
        run: python -m grx.run openprices || echo "::warning::Open Prices fetch failed"
      - name: Flyers and online prices (Flipp)
        run: python -m grx.run flipp ${{ steps.d.outputs.full == 'true' && '--full' || '' }}
      - name: Build board
        run: python -m grx.run build
      - name: Alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m grx.run alerts
      - name: Test phone push
        if: github.event.inputs.job == 'test-push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m grx.run test-push
      - name: Save working state
        uses: actions/cache/save@v4
        with:
          path: |
            data/hammer
            data/flipp/latest.json
          key: grx-state-${{ github.run_id }}
      - name: Commit price log
        run: |
          git config user.name "grx-bot"
          git config user.email "grx-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "prices $(date -u +%FT%TZ)"
          git pull --rebase -q || true
          git push -q || echo "::warning::push failed"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
